<{% extends "clinic/base.html" %}

{% block title %}Добавить отзыв - Косметологический Центр{% endblock %}

{% block content %}
<section class="review-header" style="background: linear-gradient(rgba(142, 68, 173, 0.8), rgba(155, 89, 182, 0.8)), url('/static/images/review-bg.jpg'); background-size: cover; background-position: center; color: white; padding: 3rem 0; text-align: center; margin-bottom: 3rem;">
    <div class="container">
        <h1 style="font-size: 2.5rem; margin-bottom: 1rem;">Оставить отзыв</h1>
        <p style="font-size: 1.1rem; max-width: 800px; margin: 0 auto;">Поделитесь вашими впечатлениями о нашем центре</p>
    </div>
</section>

<section class="review-form">
    <div class="container">
        <div class="card" style="max-width: 800px; margin: 0 auto; padding: 2rem;">
            <form method="post">
                {% csrf_token %}

                <div class="form-group">
                    <label for="id_doctor">Врач (если применимо)</label>
                    <select name="doctor" id="id_doctor" class="form-control">
                        <option value="">-- Не указывать --</option>
                        {% for doctor in doctors %}
                            <option value="{{ doctor.id }}">Доктор {{ doctor.user.get_full_name }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="form-group">
                    <label for="id_service">Услуга (если применимо)</label>
                    <select name="service" id="id_service" class="form-control">
                        <option value="">-- Не указывать --</option>
                        {% for service in services %}
                            <option value="{{ service.id }}">{{ service.name }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="form-group">
                    <label for="id_rating">Оценка</label>
                    <div style="display: flex; gap: 0.5rem; margin-bottom: 1rem;">
                        {% for i in "12345" %}
                            <input type="radio" name="rating" id="rating_{{ forloop.counter }}" value="{{ forloop.counter }}" style="display: none;">
                            <label for="rating_{{ forloop.counter }}" style="cursor: pointer;">
                                <i class="far fa-star" style="font-size: 2rem; color: var(--warning);"></i>
                            </label>
                        {% endfor %}
                    </div>
                </div>

                <div class="form-group">
                    <label for="id_text">Текст отзыва</label>
                    <textarea name="text" id="id_text" class="form-control" rows="5" required></textarea>
                </div>

                <div style="display: flex; justify-content: center; margin-top: 2rem;">
                    <button type="submit" class="btn">Отправить отзыв</button>
                </div>
            </form>
        </div>
    </div>
</section>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        const stars = document.querySelectorAll('input[name="rating"]');
        const starLabels = document.querySelectorAll('label[for^="rating_"]');

        stars.forEach((star, index) => {
            star.addEventListener('change', function() {
                starLabels.forEach((label, i) => {
                    if (i <= index) {
                        label.innerHTML = '<i class="fas fa-star" style="font-size: 2rem; color: var(--warning);"></i>';
                    } else {
                        label.innerHTML = '<i class="far fa-star" style="font-size: 2rem; color: var(--warning);"></i>';
                    }
                });
            });
        });
    });
</script>
{% endblock %}
